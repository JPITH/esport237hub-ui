<?xml version="1.0" encoding="UTF-8"?>
<!--
  Forme de carte G-HUB « Ticket » — source éditable.
  Repère de la carte : 300 × 419,05 (ratio 63 × 88 mm), le même que geometry.ts.
  Optimisée par `bun scripts/card-shapes.ts` (SVGO) vers generated.ts :
  ne jamais éditer generated.ts à la main.

  Éléments lus par le script (par id) :
    #frame   silhouette complète = liseré ; sert aussi de découpe (reflet, verso)
    #surface surface intérieure, retrait de 9 du liseré
    #safe    zone sûre : le gabarit du contenu y est replacé
    #sheen   boîte où le balayage « foil » peut courir sans sortir de la forme
    #crest   point d'attache HAUT de la plaque jeu (milieu de son bord supérieur)
    #footer  point d'attache BAS du pied de carte (milieu de son bord inférieur)
  Les couleurs ci-dessous ne servent qu'à l'aperçu de ce fichier (rampes du
  design system) : en production, le skin fournit les siennes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 419.05" width="300" height="419.05">
  <title>Ticket</title>
  <desc>Billet d’entrée : coins arrondis et deux encoches entre le nom et les stats.</desc>
  <path id="frame" fill="#5fb21f" d="M16 0 H284 A16 16 0 0 1 300 16 V265.93 A14 14 0 0 0 300 293.93 V403.05 A16 16 0 0 1 284 419.05 H16 A16 16 0 0 1 0 403.05 V293.93 A14 14 0 0 0 0 265.93 V16 A16 16 0 0 1 16 0 Z"/>
  <path id="surface" fill="#123100" d="M16 9 H284 A7 7 0 0 1 291 16 V258.76 A23 23 0 0 0 291 301.09 V403.05 A7 7 0 0 1 284 410.05 H16 A7 7 0 0 1 9 403.05 V301.09 A23 23 0 0 0 9 258.76 V16 A7 7 0 0 1 16 9 Z"/>
  <rect id="safe" x="36" y="36.88" width="228" height="323.51" fill="none" stroke="#15c3dd" stroke-dasharray="4 3"/>
  <rect id="sheen" x="14" y="16" width="272" height="387.05" fill="none" stroke="#caad34" stroke-dasharray="2 4"/>
  <circle id="crest" cx="150" cy="5.03" r="3" fill="#e79d38"/>
  <circle id="footer" cx="150" cy="390.55" r="3" fill="#e79d38"/>
</svg>
